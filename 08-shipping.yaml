
# ==========================================================
# Playbook: Configure Shipping Service
# ==========================================================

- name: Configuration for Shipping
  hosts: shipping                         # Target Shipping servers
  become: yes                             # Execute tasks with root privileges

  tasks:

    # --------------------------------------------------------
    # 1. Enable Maven 3.9 and Install Required Packages
    # --------------------------------------------------------

    - name: Enable Maven 3.9
      command: dnf module enable maven:3.9 -y
      # Enable Maven version 3.9 module stream

    - name: Install Maven, Java 25 and MySQL Client
      dnf:                                 # Module to manage packages
        name:
          - maven                          # Install Maven build tool
          - java-25-openjdk-devel          # Install Java 25 development tools
          - maven-openjdk25                # Configure Maven to use Java 25
          - mysql                          # Install MySQL client
        state: present                     # Ensure packages are installed

    # --------------------------------------------------------
    # 2. Create RoboShop System User
    # --------------------------------------------------------

    - name: Create roboshop system user
      user:                                # Module to manage Linux users
        name: roboshop                     # Username to create
        create_home: false                 # Do not create a home directory
        home: /app                         # Set the home directory path
        system: true                       # Create a system-level account
        shell: /sbin/nologin               # Prevent interactive login
        comment: "roboshop system user"    # Description of the user

    # --------------------------------------------------------
    # 3. Prepare Application Directory
    # --------------------------------------------------------

    - name: Remove existing app directory
      file:                                # Module to manage files/directories
        path: /app                         # Application directory
        state: absent                      # Remove directory and its contents

    - name: Remove existing shipping.zip
      file:                                # Remove previously downloaded ZIP
        path: /tmp/shipping.zip            # ZIP file location
        state: absent                      # Remove existing ZIP file

    - name: Create app directory
      file:                                # Create application directory
        path: /app                         # Application directory
        state: directory                   # Ensure directory exists
  

    # --------------------------------------------------------
    # 4. Download and Extract Shipping Source Code
    # --------------------------------------------------------

    - name: Download Shipping source code
      get_url:                             # Module to download files from a URL
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
        dest: /tmp/shipping.zip            # Save downloaded ZIP file here

    - name: Extract Shipping source code
      unarchive:                           # Module to extract archive files
        src: /tmp/shipping.zip             # Source ZIP file
        dest: /app                         # Extract files into /app
        remote_src: true                   # Archive is already on the remote server

    # --------------------------------------------------------
    # 5. Verify Maven and Java Versions
    # --------------------------------------------------------

    - name: Check Maven version
      command: mvn --version               # Display Maven and Java versions
      register: mvn_default                # Store command output in a variable

    - name: Print Maven version
      debug:                               # Module to display variable values
        msg: "{{ mvn_default.stdout_lines }}" # Print Maven and Java details

    # --------------------------------------------------------
    # 6. Build Shipping Application
    # --------------------------------------------------------

    - name: Build Shipping application
      command: mvn clean package           # Clean old build and create new JAR package
      args:
        chdir: /app                        # Run Maven from application directory

    # --------------------------------------------------------
    # 7. Move Shipping JAR File
    # --------------------------------------------------------

    - name: Move Shipping JAR file
      command: mv target/shipping.jar shipping.jar
      args:
        chdir: /app                        # Execute command from /app directory

    # --------------------------------------------------------
    # 8. Check Whether Cities Data Exists in MySQL
    # --------------------------------------------------------

    - name: Check cities data exist or not
      command: mysql -h "{{ mysql_host }}" -u root -p{{ mysql_root_password }} -N -B -e "SELECT COUNT(*) FROM cities.cities;"
      register: cities_count               # Store query result
      ignore_errors: true                  # Continue if query fails
      tags:
        - mysql

    - name: Print cities_count
      debug:                               # Display cities query result
        msg: "{{ cities_count }}"
      tags:
        - mysql

    # --------------------------------------------------------
    # 9. Load Cities Master Data into MySQL
    # --------------------------------------------------------

    - name: Load cities data into MySQL
      shell: mysql -h "{{ mysql_host }}" -u root -p{{ mysql_root_password }} < /app/db/master-data.sql
      when: cities_count.rc != 0 or cities_count.stdout | int == 0
      tags:
        - mysql

    # --------------------------------------------------------
    # 10. Create Application User in MySQL
    # --------------------------------------------------------

    - name: Create app user in MySQL
      shell: mysql -h "{{ mysql_host }}" -u root -p{{ mysql_root_password }} < /app/db/app-user.sql
      tags:
        - mysql

    # --------------------------------------------------------
    # 11. Configure Shipping Systemd Service
    # --------------------------------------------------------

    - name: Copy Shipping service file
      template:                            # Process Jinja2 template and copy it
        src: shipping.service.j2           # Source service template on control node
        dest: /etc/systemd/system/shipping.service  # Destination on Shipping server

    # --------------------------------------------------------
    # 12. Reload Systemd and Start Shipping Service
    # --------------------------------------------------------

    - name: Reload systemd
      systemd_service:                     # Module to manage systemd
        daemon_reload: true                # Reload systemd unit files

    - name: Start and enable Shipping service
      service:                             # Module to manage Linux services
        name: shipping                     # Service name
        state: restarted                   # Restart the Shipping service
        enabled: yes                       # Start automatically during boot
