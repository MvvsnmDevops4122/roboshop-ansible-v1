
# ==========================================================
# Playbook: Configure Payment Service
# ==========================================================

- name: Configuration for payment
  hosts: payment                         # Target payment servers from inventory
  become: yes                             # Execute tasks with root privileges

  tasks:

    # --------------------------------------------------------
    # 1. Install Python 3.14 and pip
    # --------------------------------------------------------

    - name: Install Python 3.14
      dnf:                                 # DNF module manages software packages on RHEL-based systems
        name:                              # Specify the packages to install
          - python3.14                     # Install Python 3.14 interpreter
          - python3.14-pip                 # Install pip package manager for Python
        state: present                     # Ensure the specified packages are installed

    # --------------------------------------------------------
    # 2. Create RoboShop System User
    # --------------------------------------------------------

    - name: Create roboshop system user
      user:                                # User module manages Linux users and groups
        name: roboshop                     # Username to create
        create_home: false                 # Do not automatically create a home directory
        home: /app                         # Set /app as the user's home directory
        system: true                       # Create a system-level user account
        shell: /sbin/nologin               # Prevent interactive login to the server
        comment: "roboshop system user"    # Add a description to the user account

    # --------------------------------------------------------
    # 3. Prepare Application Directory
    # --------------------------------------------------------

    - name: Remove existing app directory
      file:                                # File module manages files, directories and permissions
        path: /app                         # Application directory path
        state: absent                      # Remove the directory and all its contents

    - name: Remove existing payment.zip
      file:                                # File module manages files and directories
        path: /tmp/payment.zip             # Previously downloaded ZIP file location
        state: absent                      # Remove the existing ZIP file if present

    - name: Create app directory
      file:                                # File module manages files and directories
        path: /app                         # Directory where application files will be stored
        state: directory                   # Create the directory if it does not exist

   
    # --------------------------------------------------------
    # 4. Download and Extract Payment Source Code
    # --------------------------------------------------------

    - name: Download payment source code
      get_url:                             # Get URL module downloads files from remote URLs
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/payment-v4.zip
                                             # GitHub URL containing Payment application ZIP
        dest: /tmp/payment.zip             # Download and save the ZIP file on the target server

    - name: Extract payment source code
      unarchive:                           # Unarchive module extracts ZIP and other archive files
        src: /tmp/payment.zip              # Source archive file location
        dest: /app                         # Extract application files into /app
        remote_src: true                   # Archive already exists on the managed server

    # --------------------------------------------------------
    # 5. Install Python Dependencies
    # --------------------------------------------------------

    - name: Install dependencies
      pip:                                   # Pip module installs Python packages
        requirements: /app/requirements.txt
                                             # Read required Python packages from requirements.txt
        virtualenv: /app/.venv               # Create and use a Python virtual environment
        virtualenv_command: python3.14 -m venv
                                             # Use Python 3.14 to create the virtual environment

    # --------------------------------------------------------
    # 6. Configure Payment Systemd Service
    # --------------------------------------------------------

    - name: Copy payment service file
      template:                               # Template module processes Jinja2 templates and copies files
        src: payment.service.j2               # Source Jinja2 template on Ansible control node
        dest: /etc/systemd/system/payment.service
                                             # Destination systemd service file on payment server

    # --------------------------------------------------------
    # 7. Reload Systemd and Start Payment Service
    # --------------------------------------------------------

    - name: Reload systemd
      systemd_service:                    # Systemd_service module manages systemd services
        daemon_reload: true               # Reload systemd to recognize the new service file

    - name: Start and enable payment service
      service:                             # Service module manages Linux services
        name: payment                      # Name of the systemd service
        state: restarted                   # Restart the payment service
        enabled: yes                       # Enable automatic startup during system boot
