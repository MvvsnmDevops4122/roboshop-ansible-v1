# Playbook to create EC2 instances and Route 53 records
- name: Creating EC2 instances and R53 records
  hosts: local
  connection: local

  vars:
    instances: ["mongodb", "redis", "rabbitMQ", "mysql"]  # List of instance names
    action: create  # Action to perform: create or delete
    ami_id: ami-0055977a6e828a4f4  # AWS AMI ID
    domain_name: mvvsnm.online  # Domain name

  tasks:
    # Create EC2 instances for each component
    - name: Create EC2 instance
      amazon.aws.ec2_instance:  # AWS module to manage EC2 instances 
        name: "roboshop-{{ item }}"  # EC2 instance name using the current loop item
        image_id: "{{ ami_id }}"  # AMI ID used to launch the instance
        instance_type: t3.micro  # EC2 instance type
        security_groups:
          - roboshop-common-sg
          - "roboshop-{{ item }}-sg"  # Component-specific security group
        region: us-east-1  # AWS region

      loop: "{{ instances }}"  # Repeat the task for each instance name
      when: action == "create"  # Execute only when action is create
      register: ec2_output

    - name: print the ec2 output
      debug:
       msg: "{{ ec2_output }}"  