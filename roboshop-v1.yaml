- name: Creating EC2 instance and r53 records
  hosts: local
  connection: local
  vars:
   instances: ["mongodb", "redis", "rabbitMQ", "mysql"]
   action: create
   ami_id: ami-0055977a6e828a4f4
   domain_name: mvvsnm.online
  tasks:
  - name: create EC2 instance
    amazon.aws.ec2_instance:
     name: "roboshop-{{ item }}"
     image_id: "{{ ami_id }}"
     instance_type: t3.micro
     security_group:
     - roboshop-common-sg
     - "roboshop-{{ item }}-sg"
     region: us-east-1
    loop: "{{ instances }}"
    when: action == "create"