
# ==========================================================
# Playbook: Configure Cart Service
# ==========================================================

- name: Configuration for cart
  hosts: cart
  become: yes                    # Run tasks with root privileges

  tasks:

    # ------------------------------------------------------
    # 1. Configure Node.js 24
    # ------------------------------------------------------

    - name: Disable default Node.js version
      command: dnf module disable nodejs -y
      # Disable the default Node.js module stream

    - name: Enable Node.js 24
      command: dnf module enable nodejs:24 -y
      # Enable Node.js version 24

    - name: Install Node.js
      package:
        name: nodejs               # Package to install
        state: present             # Ensure package is installed


    # ------------------------------------------------------
    # 2. Create RoboShop System User
    # ------------------------------------------------------

    - name: Create roboshop system user
      user:                        # Module to manage Linux users
        name: roboshop             # Username to create
        create_home: false         # Do not create a home directory automatically
        home: /app                 # Set the user's home directory
        system: true               # Create a system user
        shell: /sbin/nologin       # Prevent interactive login
        comment: "roboshop system user"  # User description


    # ------------------------------------------------------
    # 3. Prepare Application Directory
    # ------------------------------------------------------

    - name: Remove existing app directory
      file:                        # Module to manage files and directories
        path: /app                 # Application directory
        state: absent              # Remove directory and its contents

    - name: Remove existing cart.zip
      file:
        path: /tmp/cart.zip        # ZIP file location
        state: absent              # Remove existing ZIP file

    - name: Create app directory
      file:
        path: /app                 # Directory to create
        state: directory           # Ensure directory exists
        owner: roboshop            # Set directory owner
        group: roboshop            # Set directory group


    # ------------------------------------------------------
    # 4. Download and Extract Cart Source Code
    # ------------------------------------------------------

    - name: Download cart source code
      get_url:                     # Module to download files from a URL
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/cart-v4.zip
        dest: /tmp/cart.zip        # Download destination on remote server

    - name: Extract cart source code
      unarchive:                   # Module to extract archive files
        src: /tmp/cart.zip         # Source ZIP file on remote server
        dest: /app                 # Extract files into /app
        remote_src: true           # Archive already exists on remote server


    # ------------------------------------------------------
    # 5. Install Node.js Dependencies
    # ------------------------------------------------------

    - name: Install npm dependencies
      community.general.npm:       # Module to manage npm packages
        path: /app                 # Directory containing package.json


    # ------------------------------------------------------
    # 6. Configure Cart Service
    # ------------------------------------------------------

    - name: Copy cart service file
      template:                    # Module to process Jinja2 templates
        src: cart.service.j2       # Template file on Ansible Controller
        dest: /etc/systemd/system/cart.service
        # Destination path on the remote server


    # ------------------------------------------------------
    # 7. Reload Systemd and Start Cart Service
    # ------------------------------------------------------

    - name: Reload systemd
      systemd_service:             # Module to manage systemd
        daemon_reload: true        # Reload systemd configuration files

    - name: Start and enable cart service
      service:                     # Module to manage Linux services
        name: cart                 # Cart service name
        state: restarted           # Restart the service
        enabled: yes               # Enable service at system boot
