
# Playbook to configure MongoDB server

- name: Configuration for MongoDB
  hosts: mongodb
  become: yes

  tasks:

    # -------------------------------------
    # Copy MongoDB repository configuration
    # -------------------------------------

    - name: Copy MongoDB repo
      copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo
  
    # -------------------------------------
    # Install MongoDB server
    # -------------------------------------

    - name: Install MongoDB server
      package:
        name: mongodb-org
        state: present

    # ----------------------------------
    # Start MongoDB service and enable 
    # ----------------------------------

    - name: Start and enable MongoDB service
      service:
        name: mongod
        state: started
        enabled: yes

    # ------------------------------------------
    # Allow MongoDB to accept remote connections
    # ------------------------------------------

    - name: Allow remote connections
      replace:
        path: /etc/mongod.conf
        regexp: '127.0.0.1'
        replace: '0.0.0.0'
    
    # ---------------------------------------------
    # Restart MongoDB to apply configuration changes
    # ----------------------------------------------

    - name: Restart MongoDB service
      service:
        name: mongod
        state: restarted

    # -------------------------------------------
    # Test inventory group variables (optional)
    # - name: Test the inventory variable
    #   debug:
    #     msg: "{{ app_name }}"
