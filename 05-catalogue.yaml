- name: Configuration for catalogue
  hosts: catalogue                     # Target inventory group
  become: yes                        # Execute tasks with root privileges

  tasks:                             # List of tasks to execute

   

    - name: Disable catalogue
      command: dnf module disable nodejs -y

   
    - name: Enable catalogue
      command: dnf module enable nodejs:24 -y
    

    - name: Install catalogue
      package:
        name: nodejs                  
        state: present               

    - name: Create roboshop system user
      user:                         # Module to manage Linux users
       name: roboshop               # Username to create
       create_home: false           # Do not create a home directory(true ← (default))
       home: /app                   # Set the home directory path to /app
       system: true                 # Create a system account(false ← (default))
       shell: /sbin/nologin         # Prevent interactive login
       comment: "roboshop system user" # Add a description to the user

    - name: Remove existing app directory
      ansible.builtin.file:
       path: /app
       state: absent

    - name: Remove catalogue.zip
      ansible.builtin.file:
       path: /tmp/catalogue.zip
       state: absent
    
    - name: create app directory
      ansible.builtin.file:
       path: /app
       state: directory

    - name: Download source code 
      get_url:
       url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
       dest: /tmp/catalogue.zip

    - name: unzip file
      unarchive:
       src: /tmp/catalogue.zip
       dest: /app
       remote_src: true #Extract an archive already on the remote machine

    - name: Install npm dependencies from package.json
      community.general.npm:
        path: /app

    - name: Copy the catalogue service file
      template:                                      # Module to generate a file using Jinja2 templates and copy it to the managed node
        src: catalogue.service.j2                    # Source template file on the Ansible Controller
        dest: /etc/systemd/system/catalogue.service  # Destination path on the Managed Node

    - name: Copy MongoDB repo
      copy:                                # Ansible module to copy files
        src: mongo.repo                    # Source file on the Ansible control node
        dest: /etc/yum.repos.d/mongo.repo  # Destination path on the managed node

    - name: install mongodb client
      dnf:
       name: mongodb-mongosh
       state: present
     
    - name: check products loaded or not
      command: mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
      register: product_count

    - name: print product_count
      debug:
       msg: "{{ product_count }}"
    


